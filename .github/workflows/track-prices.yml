name: 抓价

on:
  schedule:
    # cron 用的是 UTC，悉尼夏令时是 UTC+11，所以悉尼时间 = UTC + 11 小时。
    # 每天一次。改频率前先算代理额度：走代理的商品按域名收费，
    # 难抓的站点一次要十几到几十个额度，不是一次一个。
    #   加到每天两次：再加一行  - cron: "42 9 * * *"
    #   加到每 4 小时：改成     - cron: "42 */4 * * *"
    - cron: "42 21 * * *"    # 悉尼 08:42
  workflow_dispatch:        # 允许在 Actions 页面手动点一次

permissions:
  contents: write           # 脚本要把抓到的价格 commit 回仓库

concurrency:
  group: track-prices       # 防止手动触发和定时触发撞车
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        # brotli 让 requests 能解开 br 压缩，现在很多零售网站默认用它
        run: pip install requests beautifulsoup4 brotli

      - name: 抓取价格
        env:
          # 抓取代理的 token，存在仓库 Settings → Secrets 里，不在代码中。
          # 没配置也能正常跑，只是标了 "proxy": true 的商品会失败。
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
        run: python scripts/fetch_prices.py

      - name: 有变化就提交
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "价格没变化，不提交。"
          else
            git commit -m "价格更新 $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M')"
            # 定时任务和手动触发可能撞上，先 rebase 再推
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
